<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>動作解析の質問窓口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 構成：スマホで片手で使う 1 列。上に合言葉、まん中に質問欄と質問例、下に答えの履歴（新しいものが上） */
:root{
  --bg:#f5f8f8; --paper:#ffffff; --ink:#17262a; --ink-2:#44555a; --muted:#6a7a7f; --rule:#d5dfe0;
  --accent:#0d5c63; --accent-ink:#ffffff; --soft:#e9f1f1; --warn:#8a5a00; --warn-bg:#fbf3e3; --err:#a3302a; --err-bg:#fbeceb;
  --f:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101a1c; --paper:#172427; --ink:#e3ecec; --ink-2:#b9c9ca; --muted:#8fa3a5; --rule:#2c3d40;
  --accent:#5fb8be; --accent-ink:#0b1c1e; --soft:#1d2e31; --warn:#e7c27a; --warn-bg:#2d2615; --err:#f0928b; --err-bg:#331b1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101a1c; --paper:#172427; --ink:#e3ecec; --ink-2:#b9c9ca; --muted:#8fa3a5; --rule:#2c3d40;
  --accent:#5fb8be; --accent-ink:#0b1c1e; --soft:#1d2e31; --warn:#e7c27a; --warn-bg:#2d2615; --err:#f0928b; --err-bg:#331b1a; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;line-height:1.4;margin:0}
.lead{margin:4px 0 0;color:var(--ink-2);font-size:14.5px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:10px 12px}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea{min-height:96px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.count{font-size:13px;color:var(--muted);margin-left:auto}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--accent);background:var(--paper);color:var(--accent);padding:8px 16px;min-height:44px}
button.primary{background:var(--accent);color:var(--accent-ink);font-weight:700}
button:disabled{opacity:.5;cursor:default}
.examples{display:flex;flex-direction:column;gap:8px}
.examples button{text-align:left;border-radius:10px;line-height:1.5;font-size:14.5px}
.status{font-size:13.5px;color:var(--ink-2)}
.msg{border-radius:8px;padding:10px 12px;font-size:14.5px}
.msg.err{background:var(--err-bg);color:var(--err)}
.msg.wait{background:var(--soft)}
.qa{display:flex;flex-direction:column;gap:12px}
.item{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px 16px}
.item .q{font-weight:700;color:var(--accent);margin:0 0 6px}
.item .a{white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
.item .t{font-size:12px;color:var(--muted);margin-top:6px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13.5px}
.note a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>動作解析の質問窓口</h1>
    <p class="lead">片脚スクワットの解析資料（10/9 の正面の動画と、過去の記録との照合）について、AI が資料の文章と数値だけをもとに答えます。画像や動画は AI には見えていません。</p>
  </header>

  <p class="note">AI の答えは、資料を読むための手がかりです。動作の良し悪しや体の状態についての判断は、城さんと兵頭さんにお任せしています。資料にない数値には「ページにはありません」と答えます。</p>

  <section class="card" aria-label="合言葉">
    <label for="pass">合言葉</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="城さんから聞いた合言葉">
    <div class="status" id="usage" aria-live="polite"></div>
  </section>

  <section class="card" aria-label="質問">
    <label for="question">質問</label>
    <textarea id="question" maxlength="400" placeholder="例：沈み 20% では、右の 3 回の値はどれくらいですか"></textarea>
    <div class="row" style="margin-top:8px">
      <button class="primary" id="send" type="button">質問する</button>
      <span class="count" id="count">0 / 400</span>
    </div>
    <div style="margin-top:14px">
      <div class="status" style="margin-bottom:6px">質問の例（押すとそのまま聞きます）</div>
      <div class="examples" id="examples">
        <button type="button">「膝の位置の変化」は何を測っていますか。膝そのものの動きと考えてよいですか。</button>
        <button type="button">右の1回目だけ、浅いところ（沈み10%）から値が大きいのはなぜですか。</button>
        <button type="button">過去3年の記録と比べて、動きが変わったと言えますか。</button>
      </div>
    </div>
  </section>

  <div id="msg" aria-live="polite"></div>
  <section class="qa" id="qa" aria-label="答え"></section>
</div>

<script src="config.js"></script>
<script>
(function () {
  var API = (window.QA_CONFIG || {}).API_URL || '';
  var $ = function (id) { return document.getElementById(id); };
  var history = [];   // 直前のやりとり（続きの質問用。最大 3 往復をサーバーへ送る）
  var busy = false;

  try { $('pass').value = sessionStorage.getItem('qa_pass') || ''; } catch (e) { /* 保存できない環境でも使える */ }

  function show(text, kind) {
    var el = $('msg');
    el.innerHTML = '';
    if (!text) return;
    var d = document.createElement('div');
    d.className = 'msg ' + (kind || '');
    d.textContent = text;
    el.appendChild(d);
  }
  function setUsage(used, limit) {
    if (typeof used === 'number' && typeof limit === 'number') $('usage').textContent = '今日の質問：' + used + ' / ' + limit + ' 回';
  }
  function call(body) {
    return fetch(API, { method: 'POST', body: JSON.stringify(body) })   // 本文は text/plain で送る（Apps Script の受け口に合わせる）
      .then(function (r) { return r.json(); });
  }
  function addItem(q, a) {
    var item = document.createElement('article');
    item.className = 'item';
    var pq = document.createElement('p'); pq.className = 'q'; pq.textContent = 'Q. ' + q;
    var pa = document.createElement('p'); pa.className = 'a'; pa.textContent = a;
    var pt = document.createElement('div'); pt.className = 't';
    pt.textContent = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    item.appendChild(pq); item.appendChild(pa); item.appendChild(pt);
    $('qa').insertBefore(item, $('qa').firstChild);
  }
  function ask(q) {
    q = String(q || '').trim();
    var pass = $('pass').value.trim();
    if (busy) return;
    if (!API) { show('質問の受け口がまだ設定されていません（城さんに連絡してください）', 'err'); return; }
    if (!pass) { show('合言葉を入れてください', 'err'); $('pass').focus(); return; }
    if (!q) { show('質問を入力してください', 'err'); $('question').focus(); return; }
    busy = true;
    $('send').disabled = true;
    show('AI が資料を読んで答えています（10〜30 秒ほど）', 'wait');
    call({ action: 'ask', passphrase: pass, question: q, history: history.slice(-3) })
      .then(function (r) {
        if (!r.ok) { show(r.message || 'うまくいきませんでした', 'err'); return; }
        try { sessionStorage.setItem('qa_pass', pass); } catch (e) { /* 保存できなくても続ける */ }
        show('');
        addItem(q, r.answer);
        history.push({ q: q, a: r.answer });
        setUsage(r.used, r.limit);
        $('question').value = '';
        $('count').textContent = '0 / 400';
      })
      .catch(function () { show('通信できませんでした。電波のよいところで、もう一度お試しください', 'err'); })
      .then(function () { busy = false; $('send').disabled = false; });
  }

  $('send').addEventListener('click', function () { ask($('question').value); });
  $('question').addEventListener('input', function () { $('count').textContent = $('question').value.length + ' / 400'; });
  Array.prototype.forEach.call($('examples').querySelectorAll('button'), function (b) {
    b.addEventListener('click', function () { $('question').value = b.textContent; ask(b.textContent); });
  });
})();
</script>
</body>
</html>
